[package]
name = "castle_dbms"
version = "1.0.0"
edition = "2021"
description = "CASTLE: Bridging the Engineering Impedance of Learned Indexes via Pure CoW and Deterministic Recovery"
publish = false

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["time"] }
libc = "0.2"
rayon = "1.10"
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
hdrhistogram = "7.5"
rand = { version = "0.8", features = ["small_rng"] }
zipf = "0.2"

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dependencies.cxx]
version = "1.0"

[build-dependencies]
cxx-build = "1.0"
cmake = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "unwind"

[[bin]]
name = "castle_bench"
path = "src/bin/castle_bench.rs"

[[bin]]
name = "castle_verify"
path = "src/bin/castle_verify.rs"

[[test]]
name = "test_toctou_race"
path = "tests/loom/test_toctou_race.rs"

[[test]]
name = "test_atomic_swap"
path = "tests/loom/test_atomic_swap.rs"

[[test]]
name = "test_rcu_lifetimes"
path = "tests/loom/test_rcu_lifetimes.rs"

[[test]]
name = "bit_exact_hash"
path = "tests/recovery_sim/bit_exact_hash.rs"

[[test]]
name = "crash_simulator"
path = "tests/recovery_sim/crash_simulator.rs"
